<div class="modal fade" id="planningModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="background-color: var(--ppm-bg-card);">

            <div class="modal-header border-bottom" style="border-color: var(--ppm-border) !important; background-color: var(--ppm-bg-nav);">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-2 me-3 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="fas fa-magic"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold" style="color: var(--ppm-text-main);">Auto-Schedule Configuration</h5>
                        <p class="mb-0 small text-muted">Generate preventive maintenance plans automatically</p>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" style="filter: var(--btn-close-filter);"></button>
            </div>

            <form id="initializationForm" method="post" action="{% url 'trigger_initialization' %}">
                {% csrf_token %}
                <div class="modal-body p-4">

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted mb-3">1. Select Strategy</label>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="planning-option-card selected" data-logic="department">
                                    <input type="radio" name="planning_logic" value="department" checked class="d-none">
                                    <div class="d-flex align-items-center mb-2">
                                        <i class="fas fa-building text-primary me-2"></i>
                                        <h6 class="mb-0 fw-bold" style="color: var(--ppm-text-main);">Department Based</h6>
                                    </div>
                                    <p class="small text-muted mb-0 ps-4">Schedules entire departments in specific months.</p>
                                    <div class="check-circle"><i class="fas fa-check"></i></div>
                                </label>
                            </div>
                            <div class="col-md-6">
                                <label class="planning-option-card" data-logic="description">
                                    <input type="radio" name="planning_logic" value="description" class="d-none">
                                    <div class="d-flex align-items-center mb-2">
                                        <i class="fas fa-tags text-info me-2"></i>
                                        <h6 class="mb-0 fw-bold" style="color: var(--ppm-text-main);">Equipment Type</h6>
                                    </div>
                                    <p class="small text-muted mb-0 ps-4">Groups similar equipment types together.</p>
                                    <div class="check-circle"><i class="fas fa-check"></i></div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted mb-3">2. Settings</label>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="small text-muted mb-1">Interval</label>
                                <div class="d-flex gap-2">
                                    <input type="hidden" name="maintenance_period" id="maintenancePeriod" value="6">
                                    <button type="button" class="btn btn-outline-secondary flex-fill period-btn" data-period="3">3 Months</button>
                                    <button type="button" class="btn btn-primary flex-fill period-btn active" data-period="6">6 Months</button>
                                    <button type="button" class="btn btn-outline-secondary flex-fill period-btn" data-period="12">1 Year</button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="small text-muted mb-1">Start From</label>
                                <div class="input-group">
                                    <select class="form-select" name="base_month">
                                        {% for month in months_list %}
                                        <option value="{{ month.number }}" {% if current_month == month.number %}selected{% endif %}>
                                            {{ month.name }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                    <input type="number" class="form-control" name="base_year" value="{{ current_year }}" style="max-width: 80px;">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="small text-muted mb-1">Batch Limit</label>
                                <input type="number" class="form-control" name="max_consecutive" value="20" min="5" max="100">
                            </div>
                        </div>
                    </div>

                    <div class="bg-primary bg-opacity-10 p-3 rounded border border-primary border-opacity-25">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="preserve_existing" id="preserveCheck" checked>
                            <label class="form-check-label fw-semibold" for="preserveCheck" style="color: var(--ppm-text-main);">
                                Preserve existing schedules
                            </label>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top" style="border-color: var(--ppm-border) !important; background-color: var(--ppm-bg-nav);">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="fas fa-play me-2"></i>Generate
                    </button>
                </div>
            </form>

            <div id="modalLoadingOverlay" class="position-absolute top-0 start-0 w-100 h-100 d-none flex-column align-items-center justify-content-center"
                 style="background: var(--ppm-bg-card); z-index: 10; opacity: 0.98;">
                <div class="spinner-border text-primary mb-3"></div>
                <h5 class="fw-bold" style="color: var(--ppm-text-main);">Processing...</h5>
                <p class="text-muted" id="statusMessage">Initializing...</p>
                <div class="progress w-50 mt-2" style="height: 6px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" id="initProgress" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>
</div>
