{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something went wrong — Equiper</title>
  <script>
    try {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('equiper-theme') || 'light');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  <link rel="stylesheet" href="{% static 'css/theme.css' %}" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .error-page { max-width: 480px; }
    .error-code {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0;
      color: var(--danger-color);
      font-weight: 600;
      margin: 0 0 12px;
    }
    .error-title { font-size: var(--fs-lg, 1.25rem); font-weight: 600; margin: 0 0 10px; }
    .error-message { color: var(--text-secondary); margin: 0 0 28px; line-height: 1.6; }
    .error-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-home {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--primary-color); color: var(--text-white);
      padding: 10px 20px; border-radius: 8px; text-decoration: none;
      font-weight: 500; font-size: 14px; transition: background .15s ease;
    }
    .btn-home:hover { background: var(--primary-hover); }
  </style>
</head>

<body>
  <div class="error-page">
    <p class="error-code">Error 500</p>
    <h1 class="error-title">Something went wrong</h1>
    <p class="error-message">An unexpected error occurred on our end. Try again in a moment — if it keeps happening, let your system administrator know.</p>
    <div class="error-actions">
      <a href="/" class="btn-home">Go to dashboard</a>
    </div>
  </div>
</body>

</html>
