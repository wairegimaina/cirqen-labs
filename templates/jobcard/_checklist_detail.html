{% if checklist %}
<div class="row full checklist-detail">
    <strong>Checklist:</strong>
    <ul class="checklist-results">
        {% for entry in checklist %}
        <li>
            <span class="checklist-result checklist-result--{{ entry.result }}">{% if entry.result == "pass" %}Pass{% elif entry.result == "fail" %}Fail{% else %}N/A{% endif %}</span>
            <span>{{ entry.item }}{% if entry.note %} <em>({{ entry.note }})</em>{% endif %}</span>
        </li>
        {% endfor %}
    </ul>
</div>
{% endif %}
