<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="background:#0b4f71;color:#ffffff;padding:16px 24px;font-size:18px;font-weight:bold;">{{ app_name }}</td></tr>
        <tr><td style="padding:24px;font-size:14px;line-height:1.5;">{% block body %}{% endblock %}</td></tr>
        <tr><td style="padding:12px 24px;font-size:12px;color:#6b7280;border-top:1px solid #e5e7eb;">
          Automatic message from {{ app_name }}. The Head of Department is copied on mail to staff; the Deputy HOD on mail to the HOD.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
