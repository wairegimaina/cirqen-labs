# CI for Equiper (IMPROVEMENT_PLAN.md section 6). Make all three jobs required
# status checks on main in the repository's branch protection settings.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check --output-format github .

  django-tests:
    # Includes core.tests.test_route_smoke: every route under 500 for every role.
    runs-on: ubuntu-latest
    env:
      # settings.py reads config from here; CI gets a throwaway directory.
      # The runner context is not available in job-level env (only in steps),
      # and using it here made GitHub reject the whole workflow.
      CIRQEN_DATA_DIR: /tmp/cirqen-data
      DJANGO_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python manage.py check --settings=Equiper.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=Equiper.test_settings
      # No GPL, AGPL or unlicensed package may ship in the desktop build.
      - run: python helper_scripts/licence_report.py > /dev/null
      # Coverage of money, certificate and permission code must stay >= 80% (.coveragerc).
      - run: coverage run manage.py test --settings=Equiper.test_settings
      - run: coverage report

  django-pg-tests:
    # Tests of the raw PostgreSQL SQL the sync agent and migrate_hq run
    # (core.testing.requires_postgres). They skip on SQLite, so run them here.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CIRQEN_DATA_DIR: /tmp/cirqen-data
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      CIRQEN_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/cirqen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python manage.py test --tag postgres --settings=Equiper.test_settings

  e2e:
    # Browser journeys (e2e/tests.py): work order raised, signed, approved on
    # the phone page and printed; calibration performed, reviewed, certified.
    runs-on: ubuntu-latest
    env:
      CIRQEN_DATA_DIR: /tmp/cirqen-data
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      CIRQEN_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py test e2e --settings=Equiper.test_settings -v 2

  sync-tests:
    runs-on: ubuntu-latest
    env:
      # Fail instead of skipping if PostgreSQL is missing.
      CIRQEN_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install PostgreSQL server binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: pip install -r requirements.txt
      - run: python -m pytest
