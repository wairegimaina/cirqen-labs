# Nightly Level 6 load test (plan 1D): 12,000 machines, every page, every
# role, on PostgreSQL. Fails on any 5xx or any page slower than 2 seconds.
name: Nightly load test

on:
  schedule:
    - cron: "17 1 * * *"   # 04:17 in Nairobi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level6-load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: load-test-only
          POSTGRES_DB: cirqen_load
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CIRQEN_DATA_DIR: /tmp/cirqen-data
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      CIRQEN_LOAD_TEST: "1"
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: load-test-only
      PGDATABASE: cirqen_load
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test core.tests.test_load_level6 --settings=Equiper.load_test_settings -v 2
