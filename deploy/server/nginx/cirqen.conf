# nginx site for Cirqen server mode. install.sh copies this to
# /etc/nginx/sites-available/cirqen and fills in SERVER_NAMES.

upstream cirqen_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    # listen [::]:80;   # enable if the server has IPv6; nginx will not start without it
    server_name SERVER_NAMES;
    return 301 https://$host$request_uri;
}

server {
    # 'listen ... http2' rather than 'http2 on': Ubuntu 22.04/24.04 ship nginx < 1.25.
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;   # enable if the server has IPv6
    server_name SERVER_NAMES;

    # The hospital's certificate, or the self-signed one install.sh made.
    ssl_certificate     /etc/cirqen/tls/cirqen.crt;
    ssl_certificate_key /etc/cirqen/tls/cirqen.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cirqen:10m;

    client_max_body_size 25m;     # Excel imports, signatures, attachments
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Collected static files (manage.py collectstatic -> STATIC_ROOT).
    location /static/ {
        alias /var/lib/cirqen/staticfiles/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://cirqen_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;        # dashboard websockets
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;                         # large PDF reports
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
